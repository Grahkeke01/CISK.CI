async function pullAll(t,since){let out=[],i=0;for(;;){let q=sb.from(t).select('*');if(since)q=q.gt('updated_at',since);
 const{data,error}=await q.order('updated_at').order('id').range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break;i+=1000}return out}
async function sync(){
 if(!sb||!navigator.onLine||!ME||syncing)return;
 const{data:{session}}=await sb.auth.getSession();
 if(!session||session.user.id!=ME.id)return stat('⚠ Reconnectez-vous en ligne pour synchroniser');
 syncing=true;stat('⏳ Synchronisation…');
 try{
  const dirty=DB.records.filter(r=>r.dirty),sent=dirty.map(r=>r.dirty);
  if(dirty.length){const{error}=await sb.from('records').upsert(dirty.map(fromRec));if(error)throw error;dirty.forEach((r,i)=>{if(r.dirty===sent[i])delete r.dirty})}
  const[c,p]=await Promise.all([pullAll('centres'),pullAll('profiles')]);
  DB.centres=c;DB.users=p.map(toUser);
  const rows=await pullAll('records',DB.last),idx=new Map(DB.records.map(r=>[r.id,r]));
  for(const row of rows){const l=idx.get(row.id);if(l&&l.dirty)continue;const n=toRec(row);if(l)Object.assign(l,n);else DB.records.push(n);if(!DB.last||row.updated_at>DB.last)DB.last=row.updated_at}
  ME=DB.users.find(u=>u.id==ME.id)||ME;save();stat();if(['home'].indexOf(view)<0&&MODS[view])mod(view)
 }catch(e){console.error(e);stat('⚠ Erreur de synchronisation')}finally{syncing=false}}

${ME.role=='super'?`<a onclick="go('centres')">Gestion centres</a><a onclick="go('users')">Gestion utilisateurs</a>`:''}
<a onclick="go('home')">Tableau de bord</a><a onclick="logout()">Déconnexion</a></div><div id="back" class="noprint" style="padding:8px 14px 0;display:none"><button class="btn" onclick="back()">← Retour</button></div><main id="main"></main>`;stat();go(view)}
function stat(t){const s=$('#st');if(!s)return;const o=navigator.onLine&&!!sb,n=DB.records.filter(r=>r.dirty).length;
 s.className='pill '+(o?'on':'off');s.textContent=t||(o?(n?`⚫ Online – ${n} en attente`:'⚫ Online – Synchronisé'):`⚫ Offline – ${n} en attente`)}
function logout(){sessionStorage.removeItem('disk_me');ME=null;view='home';login()}
function back(){if(editing&&MODS[view]){editing=null;mod(view)}else go('home')}
function go(v,np){if(!ME)return;view=v;if(!$('#main'))return shell();drw.classList.remove('open');editing=null;
 $('#back').style.display=v=='home'?'none':'block';if(!np&&v!='home')history.pushState({v},'');window.scrollTo(0,0);
 const m=$('#main');
 if(v=='home')m.innerHTML=`<div class="grid">${TILES.map(t=>`<button class="tile" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`;
 else if(MODS[v])mod(v);
 else if(v.startsWith('rep'))report(+v.slice(3));
 else if(v=='centres')centres();else if(v=='users')users();
 else m.innerHTML=`<h2>${E((TILES.find(t=>t[0]==v)||[0,0,v])[2])}</h2><p>Module bientôt disponible !.</p>`}
const opt=(a,s)=>`<option value="">Sélectionner</option>`+a.map(x=>`<option ${x==s?'selected':''}>${E(x)}</option>`).join('');
const today=()=>new Date().toISOString().slice(0,10),yr=()=>new Date().getFullYear();
const mine=m=>DB.records.filter(r=>r.mod==m&&!r.deleted&&r.centre==ME.centre);
const locked=r=>Date.now()-r.ts>864e5&&!r.unl;
function fld(f,v){const id='f_'+f.k,x=v[f.k]||'';
 if(f.t=='date')return`<div><label>${f.l}</label><input type="date" id="${id}" min="${yr()}-01-01" max="${yr()}-12-31" value="${x||today()}"></div>`;
 if(f.t=='age')return`<div><label>${f.l}</label><input id="${id}" pattern="\\d+[am]" placeholder="5a ou 5m" value="${E(x)}"></div>`;
 if(f.t=='diag')return`<div><label>${f.l}</label><select id="${id}_c" onchange="cat('${f.k}')">${opt(CATS,v[f.k+'_c'])}</select><select id="${id}" style="margin-top:4px">${opt(LS[v[f.k+'_c']]||[],x)}</select></div>`;
 return`<div><label>${f.l}</label><select id="${id}">${opt(f.o,x)}</select></div>`}
function cat(k){const c=$('#f_'+k+'_c').value;let l=LS[c]||[];$('#f_'+k).innerHTML=opt(k=='autre'||1?l:l)}
function mod(m){const M=MODS[m],v=editing?DB.records.find(r=>r.id==editing).d:{};cur=m;
 const cols=M.f.filter(f=>f.k!='date'&&f.k!='age'),rs=mine(m).sort((a,b)=>b.ts-a.ts);
 $('#main').innerHTML=`<h2>${M.t}</h2><div class="f">${M.f.map(f=>fld(f,v)).join('')}</div>
<button class="btn gr" onclick="saveRec()">${editing?'Mettre à jour':'Enregistrer'}</button><div id="le" style="color:#c93a2a"></div>
<div class="wrap"><table><tr><th>Date</th>${M.tr?'<th>Tranche d’âge</th>':''}${cols.map(f=>`<th>${f.l}</th>`).join('')}${m=='pf'?'<th>Ancienne utilisatrice</th>':''}<th>Actions</th></tr>
${rs.map(r=>`<tr><td>${r.d.date}</td>${M.tr?`<td>${r.tr}</td>`:''}${cols.map(f=>`<td>${E(r.d[f.k]||'')}</td>`).join('')}${m=='pf'?`<td>${r.d.nouv=='Oui'?'Non':r.d.nouv=='Non'?'Oui':''}</td>`:''}
<td>${!locked(r)&&r.uid==ME.id?`<button class="btn sm gr" onclick="editing='${r.id}';mod('${m}')">✎</button><button class="btn sm rd" onclick="delRec('${r.id}')">🗑</button>`:locked(r)?(ME.role=='super'?`<button class="btn sm" onclick="unlock('${r.id}')">🔓</button>`:'🔒'):''}</td></tr>`).join('')}</table></div>`}
function saveRec(){const M=MODS[cur],d={};
 M.f.forEach(f=>{d[f.k]=$('#f_'+f.k).value;if(f.t=='diag')d[f.k+'_c']=$('#f_'+f.k+'_c').value});
 if(!d.date)return $('#le').textContent="La date est obligatoire.";
 if(d.age!==undefined&&!/^\d+[am]$/i.test(d.age))return $('#le').textContent="Code d’âge invalide (ex : 5a ou 5m).";
 const tr=M.tr?M.tr(d.age):'';
 if(editing){const r=DB.records.find(r=>r.id==editing);r.d=d;r.tr=tr;r.dirty=Date.now()}
 else DB.records.push({id:nid(),mod:cur,centre:ME.centre,uid:ME.id,ts:Date.now(),d,tr,dirty:Date.now()});
 save();editing=null;mod(cur);stat();sync()}
function delRec(id){if(confirm("Supprimer cette ligne ?")){const r=DB.records.find(r=>r.id==id);r.deleted=true;r.dirty=Date.now();save();mod(cur);sync()}}
function unlock(id){const m=prompt("Motif du déverrouillage (obligatoire) :");if(!m||!m.trim())return;
 const r=DB.records.find(r=>r.id==id);r.unl=true;r.log=[...(r.log||[]),{by:ME.username,at:new Date().toISOString(),motif:m}];r.dirty=Date.now();save();mod(cur);sync()}
/* Centres */
function centres(){const c=editing?DB.centres.find(x=>x.id==editing):{};
 $('#main').innerHTML=`<h2>Gestion des centres</h2><div class="f">${[['nom','Nom de l’établissement'],['code','Code de l’établissement'],['pop','Population'],['region','Région sanitaire'],['district','District sanitaire']].map(([k,l])=>`<div><label>${l}</label><input id="c_${k}" value="${E(c[k]||'')}"></div>`).join('')}</div>
<button class="btn gr" onclick="saveCen()">Enregistrer</button><div class="wrap"><table><tr><th>Nom</th><th>Code</th><th>Population</th><th>Région</th><th>District</th><th></th></tr>
${DB.centres.map(c=>`<tr><td>${E(c.nom)}</td><td>${E(c.code)}</td><td>${E(c.pop)}</td><td>${E(c.region)}</td><td>${E(c.district)}</td><td><button class="btn sm gr" onclick="editing='${c.id}';centres()">✎</button><button class="btn sm rd" onclick="delCen('${c.id}')">🗑</button></td></tr>`).join('')}</table></div>`}
const NEED="Connexion internet requise pour cette opération.";
async function saveCen(){const o={};['nom','code','pop','region','district'].forEach(k=>o[k]=$('#c_'+k).value.trim());if(!o.nom)return alert("Nom obligatoire");
 if(!sb||!navigator.onLine)return alert(NEED);o.pop=+o.pop||0;if(editing)o.id=editing;
 const{error}=await sb.from('centres').upsert(o);if(error)return alert(error.message);editing=null;await sync();centres()}
async function delCen(id){if(DB.users.some(u=>u.centre==id))return alert("Ce centre a des utilisateurs.");if(!sb||!navigator.onLine)return alert(NEED);
 if(confirm("Supprimer ?")){const{error}=await sb.from('centres').delete().eq('id',id);if(error)return alert(error.message);await sync();centres()}}
/* Utilisateurs */
function users(){$('#main').innerHTML=`<h2>Gestion des utilisateurs</h2><div class="f">
<div><label>Centre</label><select id="u_c">${DB.centres.map(c=>`<option value="${c.id}">${E(c.nom)}</option>`).join('')}</select></div>
${[['nom','Nom'],['prenoms','Prénoms'],['tel','Téléphone'],['email','Email']].map(([k,l])=>`<div><label>${l}</label><input id="u_${k}"></div>`).join('')}
<div><label>Fonction</label><select id="u_fonction">${opt(FONC)}</select></div></div>
<button class="btn gr" onclick="saveUser()">Créer le compte</button><div class="wrap"><table><tr><th>Utilisateur</th><th>Nom</th><th>Centre</th><th>Fonction</th><th></th></tr>
${DB.users.map(u=>`<tr><td>${E(u.username)}</td><td>${E(u.nom+' '+u.prenoms)}</td><td>${E(cen(u.centre).nom)}</td><td>${E(u.fonction)}</td><td>${u.role=='super'?'':`<button class="btn sm" onclick="resetPw('${u.id}')">Réinit.</button><button class="btn sm rd" onclick="delUser('${u.id}')">🗑</button>`}</td></tr>`).join('')}</table></div>`}
async function saveUser(){const g=k=>$('#u_'+k).value.trim(),nom=g('nom'),tel=g('tel').replace(/\D/g,'');
 if(!nom||!g('prenoms')||tel.length<3||!g('fonction'))return alert("Nom, prénoms, téléphone (3 chiffres min) et fonction obligatoires.");
 if(!sb||!navigator.onLine)return alert(NEED);
 let un=nom[0].toUpperCase()+nom.slice(1).toLowerCase()+tel.slice(-3);if(DB.users.some(u=>u.username.toLowerCase()==un.toLowerCase()))return alert("Nom d’utilisateur déjà utilisé : "+un);
 const{error}=await sb.rpc('sgds_create_user',{p_username:un,p_password:PW0,p_centre:g('c'),p_nom:nom,p_prenoms:g('prenoms'),p_tel:g('tel'),p_email:g('email'),p_fonction:g('fonction')});
 if(error)return alert(error.message);await sync();
 const msg=`SGDS– Portail officiel\nBonjour ${nom} ${g('prenoms')},\nVotre accès au portail SGDS a été créé.\nCentre : ${cen(g('c')).nom}\nNom d’utilisateur : ${un}\nMot de passe : ${PW0}\nVeuillez changer votre mot de passe à la première connexion.\nLien : ${location.href}`;
 const d=document.createElement('div');d.className='modal';d.innerHTML=`<div><b>Envoyer les identifiants</b>\n\n${E(msg)}\n\n<a class="btn" href="sms:${tel}?body=${encodeURIComponent(msg)}">SMS</a><a class="btn gr" href="mailto:${E(g('email'))}?subject=CISK&body=${encodeURIComponent(msg)}">Email</a><button class="btn rd" onclick="this.closest('.modal').remove();users()">Fermer</button></div>`;document.body.appendChild(d)}
async function resetPw(id){if(!sb||!navigator.onLine)return alert(NEED);const{error}=await sb.rpc('cisk_reset_password',{p_user:id});alert(error?error.message:"Mot de passe remis à "+PW0+".")}
async function delUser(id){if(!sb||!navigator.onLine)return alert(NEED);if(confirm("Supprimer ?")){const{error}=await sb.rpc('cisk_delete_user',{p_user:id});if(error)return alert(error.message);await sync();users()}}
/* Rapport SIG */
function report(months){const e=new Date(),s=new Date(e.getFullYear(),e.getMonth()-months+1,1);const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 $('#main').innerHTML=`<div class="noprint"><h2>Rapport SIG</h2><div class="f"><div><label>Du</label><input type="date" id="r_s" value="${iso(s)}"></div><div><label>Au</label><input type="date" id="r_e" value="${iso(e)}"></div>
${ME.role=='super'?`<div><label>Centre</label><select id="r_c">${DB.centres.map(c=>`<option value="${c.id}" ${c.id==ME.centre?'selected':''}>${E(c.nom)}</option>`).join('')}</select></div>`:''}</div>
<button class="btn" onclick="genRep()">Générer</button><button class="btn gr" onclick="print()">Imprimer / PDF</button></div><div id="rep"></div>`;genRep()}
function genRep(){$('#rep').innerHTML=sig($('#r_s').value,$('#r_e').value,$('#r_c')?$('#r_c').value:ME.centre)}
function sig(s,e,cid){const C=cen(cid),R=DB.records.filter(r=>!r.deleted&&r.centre==cid&&r.d.date>=s&&r.d.date<=e);
 const n=(m,f)=>R.filter(r=>r.mod==m&&f(r)).length,sum=a=>a.reduce((x,y)=>x+y,0);
 const T=(h,rows)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i?'':'l'}">${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
 const row=(lb,m,f,bands)=>{const v=bands.map(b=>n(m,r=>r.tr==b&&f(r.d)));return[lb,...v,sum(v)]};
 const one=(lb,m,f)=>[lb,n(m,r=>f(r.d))];
 const H7=["Activité",...B7,"Total"];
 const morb=(t,list)=>`<h4>${t}</h4>`+T(["Indicateur",...B7,"Total","Référé"],list.map(it=>{const f=d=>d.diag==it||d.autre==it,v=row(it,'curatif',f,B7);return[...v,n('curatif',r=>f(r.d)&&r.d.issue=='Référé')]}));
 const mth=MODS.pf.f[2].o,ac=MODS.acc.f,cp=MODS.cpn.f;
 const per=`${s} au ${e}`;
 return`<div class="cover"><div class="lg"><img src="icon-192.png" alt="SGDS" height="80"><span><img src="icon-ci.png"</span></div><h1>RAPPORT MENSUEL</h1>
<p>Rapport de la période : <b>${per}</b></p><p>Etablissement sanitaire : <b>${E(C.nom)}</b></p><p>Code de l’établissement : <b>${E(C.code)}</b></p><p>District sanitaire : <b>${E(C.district||'NASSIAN')}</b></p><p>Région sanitaire : <b>${E(C.region||'BOUNKANI')}</b></p>
<p>Population desservie : <b>${E(C.pop)}</b></p><p>Établi par : ${E(ME.nom+' '+ME.prenoms)}</p></div>
<h3>I. ACTIVITE – 1. Consultation et soins – a. Soins curatifs</h3>
${T(H7,[row("Nombre de consultant",'curatif',d=>d.visite=='Consultant',B7),row("Nombre de consultation",'curatif',d=>['Consultant','Soins','Contrôle'].includes(d.visite),B7),row("Nombre de MO",'curatif',d=>d.issue=='MO',B7),row("Nombre de cas référé",'curatif',d=>d.issue=='Référé',B7),row("Nombre de décès",'curatif',d=>d.issue=='décédé',B7)])}
<h4>b. Soins infirmiers et petite chirurgie</h4>${T(["Soins","Nombre"],[one("Pansement",'curatif',d=>d.pans=='Oui'),one("Injection",'curatif',d=>d.inj=='Oui'),one("Perfusion",'curatif',d=>d.perf=='Oui'),one("Circoncision masculine",'curatif',d=>d.chir=='Circoncision'),one("Suture de plaie traumatique",'curatif',d=>d.chir=='Suture de plaie traumatique'),one("Incision d’abcès",'curatif',d=>d.chir=='Incision d’abcès'),one("Autre petite chirurgie",'curatif',d=>d.chir=='Autre petite chirurgie')])}
<h3 class="pg">2. Suivi de la mère et de l’enfant – a. Consultation prénatale</h3>
${(()=>{const c1=n('cpn',r=>r.d.cpn==cp[1].o[0]),c2=n('cpn',r=>r.d.cpn==cp[1].o[1]);return T(["Femme enceinte reçue","Nombre"],[["CPN1 au cours du 1er trimestre",c1],["CPN1 autre trimestre",c2],["Total CPN1",c1+c2],...cp[1].o.slice(2).map(o=>[o,n('cpn',r=>r.d.cpn==o)])])})()}
${T(["Dépistage des grossesses à risque","Nombre"],cp[2].o.map(o=>[o,n('cpn',r=>r.d.dep==o)]))}
${T(["Prévention au cours de la grossesse","Nombre"],cp[3].o.slice(0,5).map(o=>[o,n('cpn',r=>r.d.prev==o)]).concat([["Femme enceinte vue en CPN et ayant reçu une MILDA",n('cpn',r=>r.d.milda=='Oui')],["Femme enceinte vue en CPN et déparasitée",n('cpn',r=>r.d.depar=='Oui')],["Femme en CPN mise sous Fer+folate / counseling",n('cpn',r=>!!r.d.cpn)]]))}
<h4>b. Accouchement et consultation postnatale</h4>
${(()=>{const L=ac[2].o,a=L.slice(0,2).map(l=>row(l,'acc',d=>d.lieu==l,BA));const t=["Total",...BA.map((_,i)=>a[0][i+1]+a[1][i+1]),a[0][6]+a[1][6]];return T(["Lieu d’accouchement",...BA,"Total"],[...a,t,row("Nombre de cas référé",'acc',d=>d.lieu=='Référé',BA)])})()}
${T(["Statut vaccinal au VAT","Nombre"],ac[3].o.map(o=>[o,n('acc',r=>r.d.vacc==o)]))}
${T(["Issue de la grossesse","Nombre"],ac[4].o.map(o=>[o,n('acc',r=>r.d.issue==o)]))}
${T(["Évacuation / CO","Nombre"],ac[6].o.map(o=>[o,n('acc',r=>r.d.evac==o)]))}
${T(["Déclaration de naissance","Masculin","Féminin","Total"],[["Fiche renseignée",...['Masculin','Féminin'].map(x=>n('acc',r=>r.d.fiche=='Oui'&&r.d.sexe==x)),n('acc',r=>r.d.fiche=='Oui')],["Fiche avec informations nécessaires",...['Masculin','Féminin'].map(x=>n('acc',r=>r.d.fiche2=='Oui'&&r.d.sexe==x)),n('acc',r=>r.d.fiche2=='Oui')]])}
${T(["Consultation postnatale","Nombre"],MODS.cpon.f[2].o.map(o=>[o,n('cpon',r=>r.d.type==o)]))}
<p><i>Sections MILDA/Vitamine A, nutrition, VIH, CCC, cancer du col : à ajouter lorsque leurs modules de saisie seront créés (valeurs 0 par défaut).</i></p>
<h3 class="pg">6. Planification familiale</h3>
${T(["Méthode",...BP.map(b=>"Nouvelle "+b),"Total nouvelles","Ancienne utilisatrice","Total utilisatrices"],mth.map(m=>{const v=BP.map(b=>n('pf',r=>r.d.meth==m&&r.d.nouv=='Oui'&&r.tr==b)),a=n('pf',r=>r.d.meth==m&&r.d.nouv=='Non');return[m,...v,sum(v),a,sum(v)+a]}))}
<h3 class="pg">II. MORBIDITE</h3>${morb("Maladies infectieuses",[...LS["Paludisme"],...LS["Maladies Infectieuses"]])}
${morb("Infections sexuellement transmissibles",LS["Infections sexuelle"])}${morb("Violence basée sur le genre",LS["Violences sexuelle"])}
${morb("Affections bucco-dentaires",LS["Bucco-dentaires"])}${morb("Affections oculaires",LS["Oculaires"])}${morb("Maladies non transmissibles",LS["Maladies non transmissibles"])}`}
init();
</script></body></html>
